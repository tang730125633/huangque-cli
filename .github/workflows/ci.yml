name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check -e .
      - run: python -m unittest discover -s tests -v
      - name: Build reproducible wheel
        env:
          SOURCE_DATE_EPOCH: "1735689600"
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir "$tmp/a" .
          python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir "$tmp/b" .
          cmp "$tmp"/a/*.whl "$tmp"/b/*.whl
