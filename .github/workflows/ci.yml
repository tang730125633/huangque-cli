name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.10"}
          - {os: ubuntu-24.04, python-version: "3.13"}
          - {os: macos-latest, python-version: "3.13"}
          - {os: windows-latest, python-version: "3.10"}
          - {os: windows-latest, python-version: "3.13"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check -e .
      - run: python -m unittest discover -s tests -v
      - name: Build reproducible wheel
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.13'
        env:
          SOURCE_DATE_EPOCH: "1735689600"
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir "$tmp/a" .
          python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir "$tmp/b" .
          cmp "$tmp"/a/*.whl "$tmp"/b/*.whl
          python - "$tmp"/a/*.whl <<'PY'
          import hashlib
          import pathlib
          import re
          import sys

          wheel = pathlib.Path(sys.argv[1])
          shell = pathlib.Path("install.sh").read_text(encoding="utf-8")
          powershell = pathlib.Path("install.ps1").read_text(encoding="utf-8")
          shell_sha = re.search(r'wheel_sha256="([0-9a-f]{64})"', shell).group(1)
          ps_sha = re.search(r'\$WheelSha256 = "([0-9a-f]{64})"', powershell).group(1)
          shell_size = int(re.search(r'wheel_size="([0-9]+)"', shell).group(1))
          ps_size = int(re.search(r'\$WheelSize = ([0-9]+)', powershell).group(1))
          actual_sha = hashlib.sha256(wheel.read_bytes()).hexdigest()
          actual_size = wheel.stat().st_size
          if shell_sha != ps_sha or actual_sha != shell_sha:
              raise SystemExit(
                  f"wheel SHA mismatch: actual={actual_sha} sh={shell_sha} ps1={ps_sha}"
              )
          if shell_size != ps_size or actual_size != shell_size:
              raise SystemExit(
                  f"wheel size mismatch: actual={actual_size} sh={shell_size} ps1={ps_size}"
              )
          print(f"release wheel: {wheel.name} {actual_size} bytes sha256:{actual_sha}")
          PY
          mkdir -p dist
          cp "$tmp"/a/*.whl dist/
      - name: Preserve exact release candidate
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hq-cli-release-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  windows-installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Download exact release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hq-cli-release-wheel
          path: dist
      - name: Install with Windows PowerShell 5.1
        shell: powershell
        run: |
          $wheel = (Get-ChildItem dist\*.whl).FullName
          $hash = (Get-FileHash -LiteralPath $wheel -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $wheel).Length
          $source = [IO.File]::ReadAllText((Resolve-Path .\install.ps1))
          $pinned = ([regex]::Match($source, '\$WheelSha256 = "([0-9a-f]{64})"')).Groups[1].Value
          $pinnedSize = ([regex]::Match($source, '\$WheelSize = ([0-9]+)')).Groups[1].Value
          if (-not $pinned) { throw "install.ps1 does not pin a wheel sha256" }
          if (-not $pinnedSize) { throw "install.ps1 does not pin a wheel size" }
          if ($hash -ne $pinned) { throw "release candidate hash does not match install.ps1" }
          if ($size -ne [long]$pinnedSize) { throw "release candidate size does not match install.ps1" }
          $unicode = ([string][char]0x9EC4) + ([string][char]0x96C0)
          $root = Join-Path $env:RUNNER_TEMP ($unicode + " CLI Test")
          & .\install.ps1 -WheelPath $wheel -InstallRoot $root -NoPathUpdate
          $hq = Join-Path $root "bin\hq.cmd"
          $result = & $hq version --json | ConvertFrom-Json
          $init = [IO.File]::ReadAllText((Resolve-Path .\src\hq_cli\__init__.py))
          $expected = ([regex]::Match($init, '__version__ = "([^"]+)"')).Groups[1].Value
          if (-not $expected) { throw "cannot read CLI version" }
          if ($result.cli_version -ne $expected) { throw "unexpected CLI version" }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "HQ_TEST_ROOT=$root`n", [Text.UTF8Encoding]::new($false))
      - name: Run through cmd.exe
        shell: cmd
        run: '"%HQ_TEST_ROOT%\bin\hq.cmd" version --json'
      - name: Run and uninstall with PowerShell 7
        shell: pwsh
        run: |
          $hq = Join-Path $env:HQ_TEST_ROOT "bin\hq.cmd"
          $result = & $hq capabilities --json | ConvertFrom-Json
          if ($result.schema -ne "hq.capabilities/v1") { throw "invalid capabilities output" }
          .\uninstall.ps1 -InstallRoot $env:HQ_TEST_ROOT
          if (Test-Path $env:HQ_TEST_ROOT) { throw "uninstall left files behind" }
