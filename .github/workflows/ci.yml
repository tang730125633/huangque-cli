name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.10"}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: macos-latest, python-version: "3.13"}
          - {os: windows-latest, python-version: "3.10"}
          - {os: windows-latest, python-version: "3.13"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check -e .
      - run: python -m unittest discover -s tests -v
      - name: Build reproducible wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        env:
          SOURCE_DATE_EPOCH: "1735689600"
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir "$tmp/a" .
          python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir "$tmp/b" .
          cmp "$tmp"/a/*.whl "$tmp"/b/*.whl

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build wheel
        shell: powershell
        env:
          SOURCE_DATE_EPOCH: "1735689600"
        run: python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir dist .
      - name: Install with Windows PowerShell 5.1
        shell: powershell
        run: |
          $wheel = (Get-ChildItem dist\*.whl).FullName
          $hash = (Get-FileHash -LiteralPath $wheel -Algorithm SHA256).Hash.ToLowerInvariant()
          $installer = Join-Path $env:RUNNER_TEMP "install.ps1"
          $source = [IO.File]::ReadAllText((Resolve-Path .\install.ps1))
          $source = $source.Replace("b4480eb521370eeb79e83a66c60ad2078a04c20e09e8b864e6103bbf4a61e33f", $hash)
          [IO.File]::WriteAllText($installer, $source, [Text.ASCIIEncoding]::new())
          $unicode = ([string][char]0x9EC4) + ([string][char]0x96C0)
          $root = Join-Path $env:RUNNER_TEMP ($unicode + " CLI Test")
          & $installer -WheelPath $wheel -InstallRoot $root -NoPathUpdate
          $hq = Join-Path $root "bin\hq.cmd"
          $result = & $hq version --json | ConvertFrom-Json
          if ($result.cli_version -ne "0.10.2") { throw "unexpected CLI version" }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "HQ_TEST_ROOT=$root`n", [Text.UTF8Encoding]::new($false))
      - name: Run through cmd.exe
        shell: cmd
        run: '"%HQ_TEST_ROOT%\bin\hq.cmd" version --json'
      - name: Run and uninstall with PowerShell 7
        shell: pwsh
        run: |
          $hq = Join-Path $env:HQ_TEST_ROOT "bin\hq.cmd"
          $result = & $hq capabilities --json | ConvertFrom-Json
          if ($result.schema -ne "hq.capabilities/v1") { throw "invalid capabilities output" }
          .\uninstall.ps1 -InstallRoot $env:HQ_TEST_ROOT
          if (Test-Path $env:HQ_TEST_ROOT) { throw "uninstall left files behind" }
